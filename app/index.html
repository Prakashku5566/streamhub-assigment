<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Analytics Dashboard</title>
    <meta name="description" content="Calculate and visualize your loan EMI, total interest, and payment breakdown.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Loan Analytics</h1>
            <p>Calculate and visualize your loan details</p>
        </header>

        <main class="dashboard-grid">
            <!-- User Input Section -->
            <section class="card input-section">
                <h2>Loan Parameters</h2>
                <div class="input-group">
                    <label for="loan-amount">Loan Amount (₹)</label>
                    <input type="number" id="loan-amount" data-testid="loan-amount" value="2500000" min="0" step="1000">
                </div>
                <div class="input-group">
                    <label for="interest-rate">Interest Rate (%)</label>
                    <input type="number" id="interest-rate" data-testid="interest-rate" value="10" min="0" step="0.1" max="100">
                </div>
                <div class="input-group">
                    <label for="tenure">Tenure (Years)</label>
                    <input type="number" id="tenure" data-testid="loan-tenure" value="10" min="0" step="1">
                </div>
                <button id="calculate-btn" data-testid="calculate-button">Calculate EMI</button>
            </section>

            <!-- Results Section -->
            <section class="card results-section">
                <h2>Summary</h2>
                <div class="result-grid">
                    <div class="result-item">
                        <span class="result-label">Monthly EMI</span>
                        <span class="result-value highlight" id="monthly-emi" data-testid="emi-result">₹0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Total Interest</span>
                        <span class="result-value" id="total-interest">₹0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Total Payment</span>
                        <span class="result-value" id="total-payment">₹0</span>
                    </div>
                </div>
            </section>

            <!-- Chart Section -->
            <section class="card chart-section">
                <h2>Payment Breakdown</h2>
                <div class="chart-container" data-testid="pie-chart">
                    <canvas id="breakdown-chart"></canvas>
                </div>
                <!-- Hidden elements specifically for robust test validation -->
                <div style="display: none;">
                    <span id="chart-data-principal" data-testid="principal-value"></span>
                    <span id="chart-data-interest" data-testid="interest-value"></span>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
